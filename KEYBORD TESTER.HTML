<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keyboard Tester Pro</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 20px;
}

.keyboard {
  display: inline-block;
}

.row {
  display: flex;
  justify-content: center;
  margin: 5px;
}

.key {
  background: #1e293b;
  padding: 15px;
  margin: 3px;
  border-radius: 8px;
  min-width: 40px;
  text-align: center;
  transition: 0.2s;
}

.key.large { min-width: 80px; }
.key.xlarge { min-width: 150px; }

.active {
  background: #22c55e;
  color: black;
  transform: scale(1.1);
}
</style>
</head>

<body>

<h1>⌨️ Keyboard Tester Pro</h1>
<p>Press keys to test</p>

<div class="keyboard">

<!-- Function Keys -->
<div class="row">
  <div class="key">ESC</div>
  <div class="key">F1</div>
  <div class="key">F2</div>
  <div class="key">F3</div>
  <div class="key">F4</div>
  <div class="key">F5</div>
  <div class="key">F6</div>
  <div class="key">F7</div>
  <div class="key">F8</div>
  <div class="key">F9</div>
  <div class="key">F10</div>
  <div class="key">F11</div>
  <div class="key">F12</div>
</div>

<!-- Row 1 -->
<div class="row">
  <div class="key">~</div>
  <div class="key">1</div>
  <div class="key">2</div>
  <div class="key">3</div>
  <div class="key">4</div>
  <div class="key">5</div>
  <div class="key">6</div>
  <div class="key">7</div>
  <div class="key">8</div>
  <div class="key">9</div>
  <div class="key">0</div>
  <div class="key large">BACKSPACE</div>
</div>

<!-- Row 2 -->
<div class="row">
  <div class="key large">TAB</div>
  <div class="key">Q</div>
  <div class="key">W</div>
  <div class="key">E</div>
  <div class="key">R</div>
  <div class="key">T</div>
  <div class="key">Y</div>
  <div class="key">U</div>
  <div class="key">I</div>
  <div class="key">O</div>
  <div class="key">P</div>
</div>

<!-- Row 3 -->
<div class="row">
  <div class="key large">CAPS</div>
  <div class="key">A</div>
  <div class="key">S</div>
  <div class="key">D</div>
  <div class="key">F</div>
  <div class="key">G</div>
  <div class="key">H</div>
  <div class="key">J</div>
  <div class="key">K</div>
  <div class="key">L</div>
  <div class="key large">ENTER</div>
</div>

<!-- Row 4 -->
<div class="row">
  <div class="key large">SHIFT</div>
  <div class="key">Z</div>
  <div class="key">X</div>
  <div class="key">C</div>
  <div class="key">V</div>
  <div class="key">B</div>
  <div class="key">N</div>
  <div class="key">M</div>
  <div class="key large">SHIFT</div>
</div>

<!-- Row 5 -->
<div class="row">
  <div class="key">CTRL</div>
  <div class="key">ALT</div>
  <div class="key xlarge">SPACE</div>
  <div class="key">ALT</div>
  <div class="key">CTRL</div>
</div>

</div>

<script>
document.addEventListener("keydown", (e) => {
  let key = e.key.toUpperCase();

  if (key === " ") key = "SPACE";
  if (key === "CONTROL") key = "CTRL";
  if (key === "ESCAPE") key = "ESC";
  if (key === "CAPSLOCK") key = "CAPS";

  document.querySelectorAll(".key").forEach(k => {
    if (k.innerText === key) {
      k.classList.add("active");
    }
  });
});

document.addEventListener("keyup", (e) => {
  let key = e.key.toUpperCase();

  if (key === " ") key = "SPACE";
  if (key === "CONTROL") key = "CTRL";
  if (key === "ESCAPE") key = "ESC";
  if (key === "CAPSLOCK") key = "CAPS";

  document.querySelectorAll(".key").forEach(k => {
    if (k.innerText === key) {
      k.classList.remove("active");
    }
  });
});
</script>

</body>
</html>
